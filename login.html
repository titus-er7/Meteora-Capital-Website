<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Client login for Meteora Capital."
    />
    <title>Login | Meteora Capital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="container nav-wrap">
          <a class="brand" href="index.html" aria-label="Meteora Capital home">
            <img
              class="brand-logo"
              src="https://meteoracapital.com/wp-content/uploads/2021/12/Meteora-Capital-Icon.png"
              alt="Meteora Capital mountain logo"
            />
            <span class="brand-text">Meteora Capital</span>
          </a>

          <div class="nav-actions">
            <button
              class="nav-toggle"
              type="button"
              aria-label="Toggle navigation"
              aria-expanded="false"
              aria-controls="site-nav"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>

            <nav class="site-nav" id="site-nav" aria-label="Main navigation">
              <a href="index.html">Home</a>
              <a href="team.html">Team</a>
              <a class="mobile-login-link" href="login.html" aria-current="page">Login</a>
            </nav>

            <a class="header-cta" href="login.html" aria-current="page">
              Login
            </a>
          </div>
        </div>
      </header>

      <main class="login-page" id="top">
        <section class="login-hero" aria-labelledby="login-heading">
          <div class="container login-layout">
            <h1 class="visually-hidden" id="login-heading">Client Login</h1>
            <div class="login-panel" aria-label="Client login form">
              <form class="login-form" action="#" method="post">
                <div class="login-form-heading">
                  <p>Login</p>
                </div>

                <div class="form-field">
                  <label for="email">Email address</label>
                  <input id="email" name="email" type="email" autocomplete="email" required />
                </div>

                <div class="form-field">
                  <label for="password">Password</label>
                  <input id="password" name="password" type="password" autocomplete="current-password" required />
                </div>

                <div class="login-options">
                  <label class="remember-option">
                    <input type="checkbox" name="remember" />
                    <span>Remember me</span>
                  </label>
                  <a href="mailto:Kevin@MeteoraCapital.com">Need help?</a>
                </div>

                <button class="login-submit" type="submit">Sign in</button>
              </form>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer" id="contact">
        <div class="container footer-inner">
          <div class="footer-location">
            <p class="footer-heading">Boca Raton</p>
            <p>1200 N. Federal Hwy</p>
            <p>Suite 200</p>
            <p>Boca Raton, FL 33432</p>
          </div>

          <div class="footer-contact">
            <p class="footer-heading">Contact</p>
            <a href="mailto:Kevin@MeteoraCapital.com">Kevin@MeteoraCapital.com</a>
            <a href="mailto:into@meteoracapital.com">into@meteoracapital.com</a>
            <a href="tel:201-906-0527">201-906-0527</a>
          </div>

          <div class="footer-home">
            <a href="index.html">Home</a>
          </div>

          <div class="footer-meta">
            <p>© <span id="year"></span> Meteora Capital, LLC</p>
          </div>
        </div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
